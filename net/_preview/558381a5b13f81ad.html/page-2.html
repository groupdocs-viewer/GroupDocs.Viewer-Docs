very reached </tspan><tspan x="0" y="43.17067" font-family="Arial" font-weight="normal" font-style="normal" font-size="13.33333" fill="#23303d">97.4 percent, even through the busiest holiday season we have had.</tspan></text></g><g transform="translate(48,109.3853)"><text><tspan x="0" y="27.56267" font-family="Georgia" font-weight="normal" font-style="italic" font-size="21.33333" fill="#e07a5f">“We grew because our customers trust us to deliver good food </tspan><tspan x="0" y="51.80267" font-family="Georgia" font-weight="normal" font-style="italic" font-size="21.33333" fill="#e07a5f">on time, every time.”</tspan></text></g><path d="M43.4,109.3853 L43.4,181.8653 " stroke-width="5.333333" stroke-miterlimit="13.33333" stroke="#e07a5f" fill="none" fill-rule="evenodd" /><g transform="translate(0,181.8653)"><text><tspan x="0" y="12.50667" font-family="Arial" font-weight="normal" font-style="normal" font-size="13.33333" fill="#23303d">Growth has a cost: our Quayside warehouse ran at 94 percent of capacity from September. In December the </tspan><tspan x="0" y="27.83867" font-family="Arial" font-weight="normal" font-style="normal" font-size="13.33333" fill="#23303d">board approved the North Pier distribution centre, a second site with 6,500 pallet positions and a cold chain </tspan><tspan x="0" y="43.17067" font-family="Arial" font-weight="normal" font-style="normal" font-size="13.33333" fill="#23303d">for cheese and dairy. It opens in late 2026, and this report explains how we will pay for it.</tspan></text></g><g transform="translate(0,235.8613)"><text><tspan x="0" y="12.50667" font-family="Arial" font-weight="normal" font-style="normal" font-size="13.33333" fill="#23303d">You can follow the project on </tspan></text><a xlink:href="https://www.harborlane.example/north-pier" xmlns:xlink="http://www.w3.org/1999/xlink"><g><text><tspan x="174.9187" y="12.50667" font-family="Arial" font-weight="normal" font-style="normal" font-size="13.33333" fill="#2e8b7a">our website</tspan></text></g></a><text><tspan x="243.1013" y="12.50667" font-family="Arial" font-weight="normal" font-style="normal" font-size="13.33333" fill="#23303d">.</tspan></text><path d="M174.9187,14.40771 L243.1013,14.40771 " stroke-width="0.9765625" stroke-miterlimit="13.33333" stroke="#2e8b7a" fill="none" fill-rule="evenodd" /></g><g transform="translate(0,259.1933)"><text><tspan x="0" y="12.50667" font-family="Arial" font-weight="normal" font-style="normal" font-size="13.33333" fill="#23303d">Thank you for an extraordinary year.</tspan></text></g><g transform="translate(0,282.5253)"><text><tspan x="0" y="28.50667" font-family="Arial" font-weight="bold" font-style="normal" font-size="13.33333" fill="#23303d">Grace Holloway</tspan></text></g><g transform="translate(0,321.8573)"><text><tspan x="0" y="28.50667" font-family="Arial" font-weight="normal" font-style="normal" font-size="13.33333" fill="#23303d">Managing Director</tspan></text></g><g transform="translate(0,361.1893)"><text><tspan x="0" y="22.672" font-family="Georgia" font-weight="normal" font-style="italic" font-size="16" fill="#1f3a5f">2025 at a glance</tspan></text></g><g transform="translate(-13.33333,391.3694)"><path d="M0,0 L219.7333,0 L219.7333,107.7933 L0,107.7933 Z" fill="#1f3a5f" fill-rule="evenodd" /><g clip-path="url(#clip002Page2)"><g transform="translate(13.33333,10.66667)"><text><tspan x="0" y="26.89867" font-family="Georgia" font-weight="bold" font-style="normal" font-size="29.33333" fill="#ffffff">$21.4 m</tspan></text></g><g transform="translate(13.33333,51.996)"><text><tspan x="0" y="12.50667" font-family="Arial" font-weight="bold" font-style="normal" font-size="13.33333" fill="#ffffff">Net revenue</tspan></text></g><g transform="translate(13.33333,75.328)"><text><tspan x="0" y="11.256" font-family="Arial" font-weight="normal" font-style="normal" font-size="12" fill="#ffffff">+15% on 2024</tspan></text></g></g><path d="M227.7333,0 L443.4,0 L443.4,107.7933 L227.7333,107.7933 Z" fill="#2e8b7a" fill-rule="evenodd" /><g transform="translate(223.7333,0)" clip-path="url(#clip003Page2)"><g transform="translate(13.33333,10.66667)"><text><tspan x="0" y="26.89867" font-family="Georgia" font-weight="bold" font-style="normal" font-size="29.33333" fill="#ffffff">55,300</tspan></text></g><g transform="translate(13.33333,51.996)"><text><tspan x="0" y="12.50667" font-family="Arial" font-weight="bold" font-style="normal" font-size="13.33333" fill="#ffffff">Orders shipped</tspan></text></g><g transform="translate(13.33333,75.328)"><text><tspan x="0" y="11.256" font-family="Arial" font-weight="normal" font-style="normal" font-size="12" fill="#ffffff">+13% on 2024</tspan></text></g></g><path d="M451.4,0 L671.0667,0 L671.0667,107.7933 L451.4,107.7933 Z" fill="#e07a5f" fill-rule="evenodd" /><g transform="translate(447.4,0)" clip-path="url(#clip004Page2)"><g transform="translate(13.33333,10.66667)"><text><tspan x="0" y="26.89867" font-family="Georgia" font-weight="bold" font-style="normal" font-size="29.33333" fill="#ffffff">97.4%</tspan></text></g><g transform="translate(13.33333,51.996)"><text><tspan x="0" y="12.50667" font-family="Arial" font-weight="bold" font-style="normal" font-size="13.33333" fill="#ffffff">On time</tspan></text></g><g transform="translate(13.33333,75.328)"><text><tspan x="0" y="11.256" font-family="Arial" font-weight="normal" font-style="normal" font-size="12" fill="#ffffff">+1.3 points</tspan></text></g></g><path d="M223.7333,0 L223.7333,107.7933 " stroke-width="8" stroke-miterlimit="13.33333" stroke="#ffffff" fill="none" fill-rule="evenodd" /><path d="M447.4,0 L447.4,107.7933 " stroke-width="8" stroke-miterlimit="13.33333" stroke="#ffffff" fill="none" fill-rule="evenodd" /></g><g transform="translate(0,522.4947)"><text><tspan x="0" y="22.672" font-family="Georgia" font-weight="bold" font-style="italic" font-size="16" fill="#1f3a5f">What 2026 brings</tspan></text></g><g transform="translate(0,552.6747)"><text><tspan x="0" y="12.50667" font-family="Arial" font-weight="normal" font-style="normal" font-size="13.33333" fill="#23303d">Three things matter this year: opening the North Pier distribution centre on time and on budget, moving every </tspan><tspan x="0" y="27.83867" font-family="Arial" font-weight="normal" font-style="normal" font-size="13.33333" fill="#23303d">customer to online re-ordering, and keeping delivery above 97 percent on time while volumes grow. Each </tspan><tspan x="0" y="43.17067" font-family="Arial" font-weight="normal" font-style="normal" font-size="13.33333" fill="#23303d">has one owner on the management team, and we will report on all three every quarter.</tspan></text></g></g></g></svg>
