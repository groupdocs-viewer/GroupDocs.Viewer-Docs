<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">GroupDocs.Viewer.UI in an ASP.NET Core application</title>
  <desc id="d">The browser loads the viewer, an Angular app, from the /viewer endpoint that MapGroupDocsViewerUI maps (package GroupDocs.Viewer.UI). The app then asks the /viewer-api endpoint that MapGroupDocsViewerApi maps (package GroupDocs.Viewer.UI.SelfHost.Api) for document data and pages: view-data, create-pages, get-page, get-thumb, get-pdf, list-dir and upload-file. The API renders with GroupDocs.Viewer for .NET, reads documents and saves uploads in the ./Files folder (AddLocalStorage, package GroupDocs.Viewer.UI.Api.Local.Storage) and keeps rendered pages, thumbnails and PDFs in the ./Cache folder (AddLocalCache, package GroupDocs.Viewer.UI.Api.Local.Cache).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <g id="folder">
      <path d="M0 4 a3 3 0 0 1 3 -3 h12 l4 4 h18 a3 3 0 0 1 3 3 v19 a3 3 0 0 1 -3 3 h-34 a3 3 0 0 1 -3 -3 z" fill="#fef3c7" stroke="#f59e0b"/>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="469" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="300" y="48" width="578" height="400" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>

  <!-- the browser with the viewer app -->
  <g filter="url(#shadow)">
    <rect x="28" y="96" width="246" height="226" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <path d="M28 106 a10 10 0 0 1 10 -10 h226 a10 10 0 0 1 10 10 v14 h-246 z" fill="#f1f5f9"/>
  <circle cx="41" cy="108" r="3" fill="#f87171"/><circle cx="51" cy="108" r="3" fill="#fbbf24"/><circle cx="61" cy="108" r="3" fill="#34d399"/>
  <rect x="72" y="101" width="192" height="14" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="80" y="111.5" font-size="9.5" fill="#475569" font-family="'Roboto Mono', Consolas, monospace">localhost:5081/viewer</text>
  <rect x="29" y="120" width="244" height="16" fill="#1f3a5f"/>
  <rect x="36" y="125" width="34" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
  <rect x="210" y="125" width="10" height="6" rx="2" fill="#ffffff" opacity="0.6"/>
  <rect x="226" y="125" width="10" height="6" rx="2" fill="#ffffff" opacity="0.6"/>
  <rect x="242" y="125" width="22" height="6" rx="2" fill="#ffffff" opacity="0.6"/>
  <rect x="29" y="136" width="54" height="185" fill="#f1f5f9"/>
  <rect x="40" y="146" width="32" height="40" rx="2" fill="#ffffff" stroke="#1d4ed8"/>
  <rect x="40" y="194" width="32" height="40" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="40" y="242" width="32" height="40" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="96" y="146" width="166" height="166" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="108" y="158" width="70" height="7" rx="3.5" fill="#1f3a5f"/>
  <rect x="108" y="174" width="140" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="108" y="184" width="128" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="108" y="198" width="62" height="46" rx="3" fill="#dbeafe"/>
  <rect x="178" y="198" width="70" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="178" y="208" width="60" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="178" y="218" width="66" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="108" y="256" width="140" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="108" y="266" width="120" height="4" rx="2" fill="#e2e8f0"/>
  <text x="151" y="348" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Browser</text>
  <text x="151" y="366" font-size="11" fill="#64748b" text-anchor="middle">GroupDocs.Viewer.UI, an Angular app</text>
  <g font-size="11" fill="#334155">
    <circle cx="42" cy="394" r="8" fill="#1d4ed8"/><text x="42" y="398" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="56" y="398">loads the app from /viewer</text>
    <circle cx="42" cy="418" r="8" fill="#1d4ed8"/><text x="42" y="422" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="56" y="422">asks /viewer-api for the pages</text>
  </g>

  <!-- browser <-> endpoints -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M276 124 L320 124"/>
    <path d="M276 244 L320 244"/>
  </g>
  <circle cx="287" cy="124" r="8" fill="#1d4ed8"/><text x="287" y="128" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="287" cy="244" r="8" fill="#1d4ed8"/><text x="287" y="248" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <!-- the ASP.NET Core application -->
  <text x="322" y="74" font-size="13" font-weight="700" fill="#0f172a">my-viewer-app</text>
  <text x="420" y="74" font-size="11" fill="#64748b">ASP.NET Core application</text>

  <!-- /viewer -->
  <rect x="322" y="88" width="534" height="72" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="340" y="116" font-size="15" font-weight="700" fill="#1d4ed8" font-family="'Roboto Mono', Consolas, monospace">/viewer</text>
  <text x="430" y="116" font-size="12.5" fill="#0f172a">serves the viewer app: its page, scripts, styles and settings</text>
  <text x="340" y="142" font-size="10.5" fill="#64748b" font-family="'Roboto Mono', Consolas, monospace">MapGroupDocsViewerUI  ·  GroupDocs.Viewer.UI</text>

  <!-- /viewer-api -->
  <rect x="322" y="180" width="534" height="128" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="340" y="208" font-size="15" font-weight="700" fill="#1d4ed8" font-family="'Roboto Mono', Consolas, monospace">/viewer-api</text>
  <text x="466" y="208" font-size="12.5" fill="#0f172a">renders documents for the app</text>
  <text x="340" y="228" font-size="10.5" fill="#64748b" font-family="'Roboto Mono', Consolas, monospace">MapGroupDocsViewerApi  ·  GroupDocs.Viewer.UI.SelfHost.Api</text>
  <g font-size="9.5" fill="#1e3a8a" font-family="'Roboto Mono', Consolas, monospace">
    <rect x="340" y="238" width="61" height="18" rx="9" fill="#dbeafe"/><text x="370.5" y="250.5" text-anchor="middle">view-data</text>
    <rect x="407" y="238" width="78" height="18" rx="9" fill="#dbeafe"/><text x="446" y="250.5" text-anchor="middle">create-pages</text>
    <rect x="491" y="238" width="56" height="18" rx="9" fill="#dbeafe"/><text x="519" y="250.5" text-anchor="middle">get-page</text>
    <rect x="553" y="238" width="61" height="18" rx="9" fill="#dbeafe"/><text x="583.5" y="250.5" text-anchor="middle">get-thumb</text>
    <rect x="620" y="238" width="50" height="18" rx="9" fill="#dbeafe"/><text x="645" y="250.5" text-anchor="middle">get-pdf</text>
    <rect x="676" y="238" width="56" height="18" rx="9" fill="#dbeafe"/><text x="704" y="250.5" text-anchor="middle">list-dir</text>
    <rect x="738" y="238" width="73" height="18" rx="9" fill="#dbeafe"/><text x="774.5" y="250.5" text-anchor="middle">upload-file</text>
  </g>
  <rect x="340" y="268" width="498" height="28" rx="8" fill="#1d4ed8"/>
  <text x="589" y="286.5" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">GroupDocs.Viewer for .NET renders the pages: HTML, PNG, JPG or PDF</text>

  <!-- api <-> storage and cache -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M453 310 L453 336"/>
    <path d="M725 310 L725 336"/>
  </g>

  <!-- ./Files -->
  <rect x="322" y="338" width="262" height="92" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <use href="#folder" x="338" y="352"/>
  <text x="388" y="364" font-size="14" font-weight="700" fill="#92400e" font-family="'Roboto Mono', Consolas, monospace">./Files</text>
  <text x="388" y="381" font-size="11" fill="#334155">your documents and uploads</text>
  <text x="338" y="404" font-size="10" fill="#64748b" font-family="'Roboto Mono', Consolas, monospace">AddLocalStorage("./Files")</text>
  <text x="338" y="420" font-size="10" fill="#64748b" font-family="'Roboto Mono', Consolas, monospace">GroupDocs.Viewer.UI.Api.Local.Storage</text>

  <!-- ./Cache -->
  <rect x="594" y="338" width="262" height="92" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <use href="#folder" x="610" y="352"/>
  <text x="660" y="364" font-size="14" font-weight="700" fill="#92400e" font-family="'Roboto Mono', Consolas, monospace">./Cache</text>
  <text x="660" y="381" font-size="11" fill="#334155">rendered pages, thumbnails, PDFs</text>
  <text x="610" y="404" font-size="10" fill="#64748b" font-family="'Roboto Mono', Consolas, monospace">AddLocalCache("./Cache")</text>
  <text x="610" y="420" font-size="10" fill="#64748b" font-family="'Roboto Mono', Consolas, monospace">GroupDocs.Viewer.UI.Api.Local.Cache</text>
</svg>
