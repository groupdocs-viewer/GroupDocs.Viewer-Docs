<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Loading external resources of a document</title>
  <desc id="d">Your application renders business-flyer.docx with GroupDocs.Viewer on your own server, an isolated environment. The flyer does not store its two pictures; it links them: the GroupDocs.Viewer logo on docs.groupdocs.com and the GroupDocs symbol on blog.groupdocs.com. While rendering, GroupDocs.Viewer downloads them from the internet, through LoadOptions: SkipExternalResources = true lets nothing in, so both pictures become placeholders; WhitelistedResources, together with SkipExternalResources = true, lets in only the listed hosts, so with blog.groupdocs.com only the symbol loads; ResourceLoadingTimeout sets how long to wait for the pictures, 30 seconds by default.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <g id="sheet">
      <rect x="0" y="0" width="56" height="70" rx="4" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
      <rect x="6" y="9" width="26" height="3" rx="1.5" fill="#1f3a5f"/>
      <rect x="6" y="26" width="44" height="3" rx="1.5" fill="#cbd5e1"/>
      <rect x="6" y="32" width="38" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect x="6" y="38" width="42" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect x="24" y="53" width="26" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect x="24" y="59" width="20" height="3" rx="1.5" fill="#e2e8f0"/>
    </g>
    <g id="eye">
      <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <path d="M-11 0 Q0 -10 11 0 Q0 10 -11 0 Z" fill="none" stroke="#64748b" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#64748b"/>
    </g>
    <g id="symbol">
      <circle cx="0" cy="0" r="18" fill="#2b88d8"/>
      <circle cx="-7" cy="-6" r="4" fill="#ffffff" opacity="0.75"/>
      <circle cx="7" cy="-6" r="4" fill="#ffffff" opacity="0.75"/>
      <circle cx="0" cy="-8" r="5" fill="#ffffff"/>
      <rect x="-8" y="-1" width="16" height="12" rx="2" fill="#ffffff"/>
      <rect x="-5" y="3" width="10" height="1.8" rx="0.9" fill="#2b88d8"/>
      <rect x="-5" y="6.5" width="10" height="1.8" rx="0.9" fill="#2b88d8"/>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="495" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <g font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.2">
    <text x="40" y="31" text-anchor="start">ISOLATED ENVIRONMENT: YOUR SERVER</text>
    <text x="624" y="31" text-anchor="start">OUTSIDE: THE INTERNET</text>
  </g>

  <!-- the server -->
  <rect x="24" y="44" width="568" height="276" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- the internet -->
  <rect x="608" y="44" width="268" height="276" rx="16" fill="#f1f5f9" stroke="#e2e8f0"/>

  <!-- business-flyer.docx: two linked picture slots, nothing stored -->
  <use href="#sheet" x="98" y="196"/>
  <rect x="140" y="201" width="11" height="11" rx="2" fill="#fffbeb" stroke="#d97706" stroke-dasharray="2 2"/>
  <rect x="104" y="247" width="13" height="13" rx="2" fill="#fffbeb" stroke="#d97706" stroke-dasharray="2 2"/>
  <text x="126" y="284" font-size="11" fill="#0f172a" text-anchor="middle" font-family="'Roboto Mono', Consolas, monospace">business-flyer.docx</text>
  <text x="126" y="300" font-size="10.5" fill="#64748b" text-anchor="middle">links 2 pictures, stores none</text>

  <path d="M156 231 L194 231" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- GroupDocs.Viewer -->
  <g filter="url(#shadow)"><rect x="200" y="192" width="180" height="78" rx="14" fill="#1d4ed8"/></g>
  <text x="290" y="224" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">GroupDocs.Viewer</text>
  <text x="290" y="244" font-size="11.5" fill="#dbeafe" text-anchor="middle">renders the flyer and</text>
  <text x="290" y="259" font-size="11.5" fill="#dbeafe" text-anchor="middle">fetches what it links</text>

  <path d="M380 231 L438 231" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- the output page, with the pictures that came in -->
  <use href="#sheet" x="446" y="196"/>
  <g transform="translate(493.5 206.5) scale(0.33)"><use href="#eye"/></g>
  <g transform="translate(458.5 253.5) scale(0.39)"><use href="#symbol"/></g>
  <text x="474" y="284" font-size="11" fill="#0f172a" text-anchor="middle" font-family="'Roboto Mono', Consolas, monospace">page_1.html</text>
  <text x="474" y="300" font-size="10.5" fill="#64748b" text-anchor="middle">with the pictures let in</text>

  <!-- the pictures come in through the gate -->
  <path d="M640 96 C628 96 626 136 618 141" stroke="#d97706" stroke-width="1.6" fill="none"/>
  <path d="M640 180 C628 180 626 160 618 158" stroke="#d97706" stroke-width="1.6" fill="none"/>
  <path d="M583 150 L290 150 L290 186" stroke="#d97706" stroke-width="1.6" fill="none" marker-end="url(#amber)"/>
  <text x="436" y="141" font-size="11" fill="#b45309" text-anchor="middle">the linked pictures, downloaded while rendering</text>
  <text x="308" y="88" font-size="12" fill="#334155" text-anchor="middle">Rendering happens on your server. From outside, only the</text>
  <text x="308" y="106" font-size="12" fill="#334155" text-anchor="middle">pictures the flyer links come in, as far as LoadOptions allow.</text>

  <!-- the gate: LoadOptions -->
  <path d="M600 127 L618 133 V150 C618 162 610 170 600 174 C590 170 582 162 582 150 V133 Z" fill="#1f3a5f"/>
  <path d="M592 150 L598 156 L609 143" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the hosts -->
  <rect x="640" y="64" width="216" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <g transform="translate(672 96)"><use href="#eye"/></g>
  <text x="702" y="92" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start" font-family="'Roboto Mono', Consolas, monospace">docs.groupdocs.com</text>
  <text x="702" y="110" font-size="11" fill="#64748b" text-anchor="start">GroupDocs.Viewer logo</text>
  <rect x="640" y="148" width="216" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <g transform="translate(672 180)"><use href="#symbol"/></g>
  <text x="702" y="176" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start" font-family="'Roboto Mono', Consolas, monospace">blog.groupdocs.com</text>
  <text x="702" y="194" font-size="11" fill="#64748b" text-anchor="start">GroupDocs symbol</text>
  <text x="742" y="252" font-size="11" fill="#64748b" text-anchor="middle">The document stores only the</text>
  <text x="742" y="268" font-size="11" fill="#64748b" text-anchor="middle">pictures' addresses; they stay</text>
  <text x="742" y="284" font-size="11" fill="#64748b" text-anchor="middle">on these servers.</text>

  <!-- what LoadOptions let in -->
  <text x="40" y="343" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.2" text-anchor="start">LOADOPTIONS DECIDE WHAT COMES IN</text>
  <g font-size="11.5">
    <rect x="24" y="354" width="852" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="44" cy="370" r="8" fill="#dc2626"/><rect x="39.5" y="368.8" width="9" height="2.4" rx="1.2" fill="#ffffff"/>
    <text x="62" y="374" fill="#0f172a" text-anchor="start" font-family="'Roboto Mono', Consolas, monospace">loadOptions.SkipExternalResources = true;</text>
    <text x="512" y="374" fill="#334155" text-anchor="start">nothing comes in: both pictures become placeholders</text>

    <rect x="24" y="394" width="852" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="44" cy="418" r="8" fill="#0e9f6e"/><path d="M40 418 L43 421 L48.5 414.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="414" fill="#0f172a" text-anchor="start" font-family="'Roboto Mono', Consolas, monospace">loadOptions.SkipExternalResources = true;</text>
    <text x="62" y="431" fill="#0f172a" text-anchor="start" font-family="'Roboto Mono', Consolas, monospace">loadOptions.WhitelistedResources.Add("blog.groupdocs.com");</text>
    <text x="512" y="414" fill="#334155" text-anchor="start">only the listed hosts, as exceptions to the skip:</text>
    <text x="512" y="431" fill="#334155" text-anchor="start">the symbol loads, the logo doesn't</text>

    <rect x="24" y="450" width="852" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="44" cy="466" r="8" fill="#d97706"/><path d="M44 461.5 V466 L47.5 468" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="470" fill="#0f172a" text-anchor="start" font-family="'Roboto Mono', Consolas, monospace">loadOptions.ResourceLoadingTimeout = TimeSpan.FromSeconds(5);</text>
    <text x="512" y="470" fill="#334155" text-anchor="start">how long to wait for them (30 seconds by default)</text>
  </g>
</svg>
