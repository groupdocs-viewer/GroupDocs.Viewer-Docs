<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Where GroupDocs.Viewer finds a document's font</title>
  <desc id="d">harvest-launch.pptx sets its text in Lobster. GroupDocs.Viewer first checks whether the font is embedded in the document; PDF files usually embed their fonts, Office files usually do not. Then it checks the fonts installed on the machine and the font sources you added with FontSettings.SetFontSources and a FolderFontSource, such as the custom_fonts folder. In both cases the text renders in Lobster. Otherwise the font is substituted: a similar font chosen by the substitution rules or, on a machine with no fonts at all, a font built into GroupDocs.Viewer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0e9f6e"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="339" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <g font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.2">
    <text x="40" y="31" text-anchor="start">THE DOCUMENT</text>
    <text x="258" y="31" text-anchor="start">WHERE GROUPDOCS.VIEWER LOOKS, IN THIS ORDER</text>
    <text x="704" y="31" text-anchor="start">THE OUTPUT</text>
  </g>

  <!-- the document -->
  <rect x="24" y="118" width="200" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="40" y="146" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start" font-family="'Roboto Mono', Consolas, monospace">harvest-launch.pptx</text>
  <text x="40" y="168" font-size="11.5" fill="#475569" text-anchor="start">its text asks for <tspan font-weight="700" fill="#0f172a">Lobster</tspan></text>
  <path d="M224 154 C236 154 230 78 240 78 L254 78" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- 1: embedded -->
  <rect x="258" y="48" width="404" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="280" cy="70" r="10" fill="#1d4ed8"/><text x="280" y="74" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="298" y="74" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">Embedded in the document?</text>
  <text x="298" y="95" font-size="11" fill="#475569" text-anchor="start">PDF files usually embed their fonts; Office files usually don't.</text>

  <!-- 2: installed or in a font source -->
  <rect x="258" y="130" width="404" height="88" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="280" cy="152" r="10" fill="#1d4ed8"/><text x="280" y="156" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="298" y="156" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">Installed, or in a font source you added?</text>
  <text x="298" y="180" font-size="11" fill="#1d4ed8" text-anchor="start" font-family="'Roboto Mono', Consolas, monospace">FontSettings.SetFontSources(</text>
  <text x="298" y="196" font-size="11" fill="#1d4ed8" text-anchor="start" font-family="'Roboto Mono', Consolas, monospace">  new FolderFontSource("custom_fonts", ...));</text>
  <text x="298" y="210" font-size="10.5" fill="#475569" text-anchor="start">a folder with the font file, set before Viewer.View()</text>

  <!-- 3: substituted -->
  <rect x="258" y="238" width="404" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="280" cy="260" r="10" fill="#94a3b8"/><text x="280" y="264" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="298" y="264" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">Otherwise: substituted</text>
  <text x="298" y="285" font-size="11" fill="#475569" text-anchor="start">a similar font by the substitution rules; with no fonts at all, a built-in one</text>

  <!-- "no" steps down -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M460 110 L460 126" marker-end="url(#arrow)"/>
    <path d="M460 218 L460 234" marker-end="url(#arrow)"/>
  </g>
  <text x="468" y="123" font-size="10.5" fill="#64748b" text-anchor="start">no</text>
  <text x="468" y="231" font-size="10.5" fill="#64748b" text-anchor="start">no</text>

  <!-- outcomes -->
  <path d="M662 79 C680 79 676 110 686 110 L698 110" stroke="#0e9f6e" stroke-width="1.6" fill="none" marker-end="url(#green)"/>
  <path d="M662 174 C680 174 676 146 686 146 L698 146" stroke="#0e9f6e" stroke-width="1.6" fill="none" marker-end="url(#green)"/>
  <text x="672" y="72" font-size="10.5" fill="#0e9f6e" text-anchor="start">yes</text>
  <text x="672" y="188" font-size="10.5" fill="#0e9f6e" text-anchor="start">yes</text>
  <rect x="702" y="92" width="174" height="72" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="789" y="122" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">Renders in Lobster</text>
  <text x="789" y="143" font-size="11" fill="#475569" text-anchor="middle">as the author intended</text>
  <path d="M662 269 L696 269" stroke="#d97706" stroke-width="1.6" fill="none" marker-end="url(#amber)"/>
  <rect x="702" y="236" width="174" height="66" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="789" y="264" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">Renders in another font</text>
  <text x="789" y="284" font-size="11" fill="#475569" text-anchor="middle">silently, with no warning</text>
</svg>
