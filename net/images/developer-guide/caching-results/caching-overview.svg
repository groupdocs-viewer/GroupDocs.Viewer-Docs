<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">How GroupDocs.Viewer caches rendering results</title>
  <desc id="d">The first call to Viewer.View renders the document's pages and stores them in the cache, a FileCache folder. The second call with the same document and options reads the pages from the cache instead of rendering them again, so it returns much faster.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <g id="page">
      <rect x="0" y="0" width="36" height="46" rx="4" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
      <rect x="6" y="8" width="24" height="3" rx="1.5" fill="#cbd5e1"/>
      <rect x="6" y="14" width="20" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect x="6" y="20" width="24" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect x="6" y="32" width="24" height="10" rx="2" fill="#e44d26"/>
      <text x="18" y="40" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">HTML</text>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="339" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <g font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.2">
    <text x="135" y="30" text-anchor="middle">YOUR CODE</text>
    <text x="390" y="30" text-anchor="middle">GROUPDOCS.VIEWER</text>
    <text x="580" y="30">RESULT</text>
  </g>

  <!-- 1st call: renders and stores -->
  <rect x="40" y="68" width="190" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="56" y="87" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="1">1ST CALL</text>
  <text x="56" y="103" font-size="12" fill="#0f172a" font-family="'Roboto Mono', Consolas, monospace">viewer.View(options)</text>
  <path d="M230 90 L292 90" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="300" y="55" width="180" height="70" rx="14" fill="#1d4ed8"/></g>
  <text x="390" y="85" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Renders the pages</text>
  <text x="390" y="105" font-size="11.5" fill="#dbeafe" text-anchor="middle">the document is processed</text>
  <path d="M480 90 L566 90" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <use href="#page" x="580" y="67"/><use href="#page" x="624" y="67"/><use href="#page" x="668" y="67"/>
  <text x="728" y="86" font-size="12.5" fill="#0f172a">page_1.html … page_3.html</text>
  <text x="728" y="104" font-size="11" fill="#c2410c">takes the full rendering time</text>

  <!-- the cache between the calls -->
  <path d="M390 125 L390 147" stroke="#d97706" stroke-width="1.6" fill="none" marker-end="url(#amber)"/>
  <path d="M362 150 a3 3 0 0 1 3 -3 h16 l4 4 h40 a3 3 0 0 1 3 3 v31 a3 3 0 0 1 -3 3 h-60 a3 3 0 0 1 -3 -3 z" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="370" y="160" width="14" height="18" rx="2" fill="#ffffff" stroke="#fcd34d"/>
  <rect x="388" y="160" width="14" height="18" rx="2" fill="#ffffff" stroke="#fcd34d"/>
  <rect x="406" y="160" width="14" height="18" rx="2" fill="#ffffff" stroke="#fcd34d"/>
  <text x="440" y="164" font-size="12" font-weight="600" fill="#b45309" font-family="'Roboto Mono', Consolas, monospace">FileCache("cache")</text>
  <text x="440" y="181" font-size="11" fill="#64748b">keeps the rendered pages on disk; use one folder per document</text>
  <text x="404" y="141" font-size="10" fill="#b45309">stores</text>
  <text x="404" y="205" font-size="10" fill="#b45309">reads</text>
  <path d="M390 189 L390 211" stroke="#d97706" stroke-width="1.6" fill="none" marker-end="url(#amber)"/>

  <!-- 2nd call: reads from the cache -->
  <rect x="40" y="228" width="190" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="56" y="247" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="1">2ND CALL, SAME DOCUMENT</text>
  <text x="56" y="263" font-size="12" fill="#0f172a" font-family="'Roboto Mono', Consolas, monospace">viewer.View(options)</text>
  <path d="M230 250 L292 250" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="300" y="215" width="180" height="70" rx="14" fill="#0e9f6e"/></g>
  <text x="390" y="245" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Reads the cache</text>
  <text x="390" y="265" font-size="11.5" fill="#d1fae5" text-anchor="middle">no rendering</text>
  <path d="M480 250 L566 250" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <use href="#page" x="580" y="227"/><use href="#page" x="624" y="227"/><use href="#page" x="668" y="227"/>
  <text x="728" y="246" font-size="12.5" fill="#0f172a">the same pages</text>
  <text x="728" y="264" font-size="11" fill="#0e9f6e">returned in a fraction of the time</text>

  <text x="450" y="316" font-size="11" fill="#64748b" text-anchor="middle">The pages stay on disk, so a later Viewer, or a later run of your app, that uses the same folder reuses them too.</text>
</svg>
