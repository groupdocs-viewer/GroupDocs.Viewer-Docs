<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">How a document gets to GroupDocs.Viewer</title>
  <desc id="d">The Viewer class takes a document as a file path or as a stream. A file on disk is passed by its path. Bytes in memory, and a document downloaded from a web address, are passed as a file object or io.BytesIO. LoadOptions, all optional, tell the Viewer the file type when it cannot be detected, the password of an encrypted document, the encoding of a text file, and how to treat external resources. Then viewer.view renders HTML, PDF, PNG or JPG pages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="329" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <g font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.2">
    <text x="40" y="31" text-anchor="start">WHERE THE DOCUMENT IS</text>
    <text x="316" y="31" text-anchor="start">WHAT YOUR CODE PASSES</text>
    <text x="606" y="31" text-anchor="start">GROUPDOCS.VIEWER</text>
  </g>

  <!-- sources -->
  <g font-size="12.5" fill="#0f172a">
    <rect x="24" y="48" width="236" height="36" rx="9" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="40" y="71" text-anchor="start">File on disk</text>
    <rect x="24" y="162" width="236" height="36" rx="9" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="40" y="185" text-anchor="start">Bytes in memory</text>
    <rect x="24" y="206" width="236" height="36" rx="9" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="40" y="229" text-anchor="start">Web address (URL)</text>
  </g>

  <!-- what the code passes -->
  <rect x="300" y="44" width="250" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="316" y="63" font-size="12.5" font-weight="600" fill="#1d4ed8" text-anchor="start" font-family="'Roboto Mono', Consolas, monospace">"sample.docx"</text>
  <text x="316" y="79" font-size="11" fill="#64748b" text-anchor="start">a file path</text>
  <rect x="300" y="160" width="250" height="84" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="316" y="184" font-size="12.5" font-weight="600" fill="#1d4ed8" text-anchor="start" font-family="'Roboto Mono', Consolas, monospace">io.BytesIO(data)</text>
  <text x="316" y="206" font-size="11" fill="#64748b" text-anchor="start">wraps the bytes you have or downloaded;</text>
  <text x="316" y="222" font-size="11" fill="#64748b" text-anchor="start">a file object from open() works too</text>

  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M260 66 L294 66" marker-end="url(#arrow)"/>
    <path d="M260 180 C272 180 270 194 282 194 L296 194" marker-end="url(#arrow)"/>
    <path d="M260 224 C272 224 270 208 282 208 L296 208" marker-end="url(#arrow)"/>
    <path d="M550 66 C570 66 572 76 586 76 L602 76" marker-end="url(#arrow)"/>
    <path d="M550 202 C580 202 570 104 586 104 L602 104" marker-end="url(#arrow)"/>
  </g>

  <!-- the Viewer -->
  <g filter="url(#shadow)"><rect x="606" y="44" width="270" height="80" rx="14" fill="#1d4ed8"/></g>
  <text x="741" y="76" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Roboto Mono', Consolas, monospace">Viewer(source, load_options)</text>
  <text x="741" y="98" font-size="11.5" fill="#dbeafe" text-anchor="middle">detects the format and opens the document</text>
  <path d="M741 124 L741 146" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 3" fill="none"/>
  <rect x="606" y="146" width="270" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="622" y="168" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start" font-family="'Roboto Mono', Consolas, monospace">LoadOptions()</text>
  <text x="860" y="168" font-size="10.5" fill="#64748b" text-anchor="end">all optional</text>
  <g font-size="11" fill="#334155">
    <text x="622" y="192" text-anchor="start"><tspan font-family="'Roboto Mono', Consolas, monospace" fill="#1d4ed8">file_type</tspan>  when it can't be detected</text>
    <text x="622" y="214" text-anchor="start"><tspan font-family="'Roboto Mono', Consolas, monospace" fill="#1d4ed8">password</tspan>  for an encrypted document</text>
    <text x="622" y="236" text-anchor="start"><tspan font-family="'Roboto Mono', Consolas, monospace" fill="#1d4ed8">encoding</tspan>  for a text file</text>
    <text x="622" y="258" text-anchor="start"><tspan font-family="'Roboto Mono', Consolas, monospace" fill="#1d4ed8">skip_external_resources</tspan> and</text>
    <text x="622" y="274" text-anchor="start">timeouts  for linked pictures</text>
  </g>

  <text x="190" y="312" font-size="12" fill="#334155" text-anchor="start">Then <tspan font-family="'Roboto Mono', Consolas, monospace" fill="#1d4ed8">viewer.view(view_options)</tspan> renders the pages: HTML, PDF, PNG or JPG.</text>
</svg>
