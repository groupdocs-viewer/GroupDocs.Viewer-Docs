<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">HTML with embedded or external resources</title>
  <desc id="d">A three-page DOCX rendered to HTML two ways. With embedded resources, each page is one HTML file that holds its fonts, images and styles. With external resources, each page is an HTML file plus a folder of font, image and style files that the page links to.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <!-- an HTML page, 48 x 62 -->
    <g id="hpage">
      <rect x="0" y="0" width="48" height="62" rx="4" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
      <rect x="6" y="8" width="26" height="4" rx="2" fill="#1f3a5f"/>
      <rect x="6" y="16" width="36" height="3" rx="1.5" fill="#cbd5e1"/>
      <rect x="6" y="22" width="30" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect x="6" y="48" width="26" height="10" rx="2" fill="#e44d26"/>
      <text x="19" y="56" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">HTML</text>
    </g>
    <!-- what an embedded page carries inside: a picture and a font -->
    <g id="inside">
      <rect x="6" y="29" width="17" height="14" rx="2" fill="#dbeafe"/>
      <path d="M8 41 L13 34 L16 38 L18 35 L21 41 z" fill="#93c5fd"/>
      <text x="35" y="40" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Georgia, serif">Aa</text>
    </g>
    <!-- a resource folder, 52 x 28, holding a font, a picture and a style sheet -->
    <g id="folder">
      <path d="M0 4 a3 3 0 0 1 3 -3 h14 l4 4 h28 a3 3 0 0 1 3 3 v20 a3 3 0 0 1 -3 3 h-46 a3 3 0 0 1 -3 -3 z" fill="#fef3c7" stroke="#f59e0b"/>
      <rect x="5" y="10" width="12" height="12" rx="2" fill="#ffffff" stroke="#fcd34d"/>
      <text x="11" y="19" font-size="6.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Georgia, serif">Aa</text>
      <rect x="20" y="10" width="12" height="12" rx="2" fill="#dbeafe"/>
      <path d="M21 21 L25 15 L28 18 L31 21 z" fill="#93c5fd"/>
      <rect x="35" y="10" width="12" height="12" rx="2" fill="#ffffff" stroke="#fcd34d"/>
      <text x="41" y="19" font-size="6.5" font-weight="700" fill="#7e3af2" text-anchor="middle" font-family="'Roboto Mono', Consolas, monospace">{}</text>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="399" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- the source document: three pages -->
  <g transform="translate(0 -38)">
    <rect x="86" y="128" width="120" height="156" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="78" y="136" width="120" height="156" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <g filter="url(#shadow)">
      <rect x="70" y="144" width="120" height="156" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    </g>
    <rect x="82" y="158" width="58" height="7" rx="3.5" fill="#1f3a5f"/>
    <rect x="82" y="174" width="96" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="82" y="184" width="88" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="82" y="194" width="92" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="82" y="208" width="44" height="34" rx="3" fill="#dbeafe"/>
    <rect x="132" y="208" width="46" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="132" y="218" width="40" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="132" y="228" width="44" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="82" y="250" width="92" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="82" y="260" width="80" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="148" y="278" width="34" height="14" rx="3" fill="#2b579a"/>
    <text x="165" y="288.5" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">DOCX</text>
  </g>
  <text x="130" y="286" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">sample.docx</text>
  <text x="130" y="304" font-size="12" fill="#64748b" text-anchor="middle">3 pages</text>

  <g stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M206 170 C232 170 228 117 254 117"/>
    <path d="M206 204 C232 204 228 269 254 269"/>
  </g>

  <!-- embedded: one file per page, everything inside -->
  <text x="262" y="72" font-size="12" font-weight="600" fill="#1d4ed8" font-family="'Roboto Mono', Consolas, monospace">HtmlViewOptions.for_embedded_resources()</text>
  <use href="#hpage" x="262" y="86"/><use href="#inside" x="262" y="86"/>
  <use href="#hpage" x="326" y="86"/><use href="#inside" x="326" y="86"/>
  <use href="#hpage" x="390" y="86"/><use href="#inside" x="390" y="86"/>
  <g font-size="10" fill="#475569">
    <text x="286" y="164" text-anchor="middle">page_1.html</text>
    <text x="350" y="164" text-anchor="middle">page_2.html</text>
    <text x="414" y="164" text-anchor="middle">page_3.html</text>
  </g>
  <text x="590" y="106" font-size="12.5" fill="#0f172a">One file per page</text>
  <text x="590" y="124" font-size="11" fill="#64748b">fonts, pictures and styles inside the HTML</text>
  <text x="590" y="142" font-size="11" fill="#0e9f6e">+ self-contained: easy to serve, copy or email</text>
  <text x="590" y="158" font-size="11" fill="#c2410c">− each page repeats the resources it shares</text>

  <line x1="254" y1="196" x2="868" y2="196" stroke="#e2e8f0"/>

  <!-- external: a page and a folder of resources -->
  <text x="262" y="226" font-size="12" font-weight="600" fill="#1d4ed8" font-family="'Roboto Mono', Consolas, monospace">HtmlViewOptions.for_external_resources()</text>
  <use href="#hpage" x="262" y="238"/>
  <use href="#hpage" x="326" y="238"/>
  <use href="#hpage" x="390" y="238"/>
  <g font-size="10" fill="#475569">
    <text x="286" y="316" text-anchor="middle">page_1.html</text>
    <text x="350" y="316" text-anchor="middle">page_2.html</text>
    <text x="414" y="316" text-anchor="middle">page_3.html</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="286" y1="321" x2="286" y2="329"/>
    <line x1="350" y1="321" x2="350" y2="329"/>
    <line x1="414" y1="321" x2="414" y2="329"/>
  </g>
  <use href="#folder" x="260" y="331"/>
  <use href="#folder" x="324" y="331"/>
  <use href="#folder" x="388" y="331"/>
  <g font-size="9.5" fill="#475569" font-family="'Roboto Mono', Consolas, monospace">
    <text x="286" y="376" text-anchor="middle">page_1/</text>
    <text x="350" y="376" text-anchor="middle">page_2/</text>
    <text x="414" y="376" text-anchor="middle">page_3/</text>
  </g>
  <text x="590" y="258" font-size="12.5" fill="#0f172a">A page and a folder of resources</text>
  <text x="590" y="276" font-size="11" fill="#64748b">fonts, pictures and styles as files the page links to</text>
  <text x="590" y="294" font-size="11" fill="#0e9f6e">+ smaller pages; a browser can cache the resources</text>
  <text x="590" y="310" font-size="11" fill="#c2410c">− publish the folders together with the pages</text>
</svg>
